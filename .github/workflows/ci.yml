name: FAULTLINE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    name: Windows Release
    runs-on: windows-2025
    timeout-minutes: 45

    defaults:
      run:
        working-directory: FAULTLINE_GAME_V1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Bootstrap portable toolchain
        run: python tools/bootstrap_windows.py

      - name: Build and full test suite
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build.ps1 -Configuration Release

      - name: Upload CTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-test-logs
          path: FAULTLINE_GAME_V1/build-release/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14

  linux-release:
    name: Linux Release
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    defaults:
      run:
        working-directory: FAULTLINE_GAME_V1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Toolchain information
        run: |
          g++ --version
          cmake --version
          ninja --version

      - name: Configure Release
        run: |
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build-release --parallel 2

      - name: Full test suite
        run: |
          ctest --test-dir build-release \
            --output-on-failure \
            --no-tests=error

      - name: Upload CTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-test-logs
          path: FAULTLINE_GAME_V1/build-release/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14
